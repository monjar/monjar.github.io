      /* Pick the palette before first paint: stored choice, else the OS. */
      (function () {
        try {
          var m = localStorage.getItem("monjar-fan-mode");

          var d = document.documentElement;
          d.dataset.palette = m === "dark" ? "forest" : "royal";
          d.style.colorScheme = m;
        } catch (e) {}
      })();
